<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S$NEER Shadow Proxy</title>
    <meta
      name="description"
      content="Static S$NEER shadow proxy dashboard generated from observable SGD crosses."
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1318;
        --panel: #171c24;
        --text: #e7edf5;
        --muted: #9aa6b6;
        --line: #2b3340;
        --accent: #15c8b5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header {
        margin-bottom: 24px;
      }

      p {
        max-width: 760px;
        color: var(--muted);
      }

      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 10px 0 12px;
        font-size: clamp(32px, 5vw, 56px);
        line-height: 1.02;
      }

      figure {
        margin: 28px 0 0;
        border: 1px solid var(--line);
        background: var(--panel);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      figcaption {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        padding: 14px 16px;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      a {
        color: var(--text);
        text-decoration-color: rgba(21, 200, 181, 0.55);
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">SGD NEER Monitor</div>
        <h1>S$NEER Shadow Proxy</h1>
        <p>
          Static dashboard generated from observable SGD crosses. MAS does not disclose the
          official S$NEER basket, centre, slope, or band width, so this is a transparent
          proxy rather than an official index.
        </p>
        <div class="links">
          <a href="sgd_neer_dashboard.png">Open dashboard PNG</a>
          <a href="Preview.png">Open preview image</a>
        </div>
      </header>

      <figure>
        <img src="sgd_neer_dashboard.png" alt="S$NEER shadow proxy dashboard" />
        <figcaption>
          Generated by SGD.py. Higher proxy index values indicate broad SGD strength in the
          observable trade-weighted basket.
        </figcaption>
      </figure>
    </main>
  </body>
</html>
